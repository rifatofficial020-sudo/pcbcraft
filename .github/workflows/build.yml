
name: PCBCraft Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"

      - name: Build
        run: cargo build --locked --release -p pcbcraft -p pcbcraft-cli

      - uses: actions/upload-artifact@v4
        with:
          name: pcbcraft-windows
          path: |
            target/release/pcbcraft.exe
            target/release/pcbcraft-cli.exe

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxi-dev libxrandr-dev libxcursor-dev libgl1-mesa-dev

      - name: Build
        run: cargo build --locked --release -p pcbcraft -p pcbcraft-cli

      - uses: actions/upload-artifact@v4
        with:
          name: pcbcraft-linux
          path: |
            target/release/pcbcraft
            target/release/pcbcraft-cli
